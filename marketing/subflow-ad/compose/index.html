<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Uko × SubFlow — pub 9:16</title>
<style>
  @font-face { font-family: 'Space Grotesk'; src: url(/landing_page/fonts/SpaceGrotesk.woff2) format('woff2'); font-weight: 300 700; }
  @font-face { font-family: 'Caveat'; src: url(/landing_page/fonts/Caveat.woff2) format('woff2'); font-weight: 400 700; }
  @font-face { font-family: 'JetBrains Mono'; src: url(/landing_page/fonts/JetBrainsMono.woff2) format('woff2'); font-weight: 100 800; }
  :root {
    --paper: #F4F7FF; --ink: #16161D; --ink-soft: #4B4E63; --blue: #3B5BFF; --sun: #FFC93C; --pink: #FF7AAE;
    --mint: #3DDC97; --night: #0E1130; --pine: #3B4D3C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Space Grotesk', sans-serif; color: var(--ink);
    background-color: var(--paper);
    background-image: linear-gradient(rgba(59, 91, 255, .09) 2px, transparent 2px), linear-gradient(90deg, rgba(59, 91, 255, .09) 2px, transparent 2px);
    background-size: 54px 54px; }
  .abs { position: absolute; }
  /* progress (story style) */
  #progress { left: 40px; right: 40px; top: 34px; height: 8px; display: flex; gap: 10px; z-index: 30; }
  #progress i { flex: 1; border-radius: 99px; background: rgba(22, 22, 29, .14); overflow: hidden; position: relative; }
  #progress i b { position: absolute; inset: 0; width: 0; background: var(--ink); border-radius: 99px; }
  /* captions */
  .cap { left: 70px; right: 70px; top: 110px; z-index: 20; }
  .cap .line { font-weight: 700; font-size: 92px; line-height: 1.02; letter-spacing: -0.035em; white-space: nowrap; }
  .cap .line.hand { font-family: 'Caveat', cursive; font-size: 100px; color: var(--blue); letter-spacing: 0; }
  .cap .w { display: inline-block; transform-origin: 50% 80%; will-change: transform, opacity; }
  .chip { display: inline-flex; align-items: center; gap: 14px; margin-top: 22px; padding: 12px 22px; border-radius: 16px; background: var(--ink); color: #fff;
    font: 600 34px 'JetBrains Mono', monospace; box-shadow: 6px 6px 0 var(--sun); }
  .chip em { font-style: normal; color: var(--sun); }
  .note { font-family: 'Caveat', cursive; font-size: 62px; color: var(--pink); z-index: 22; white-space: nowrap; }
  /* phone */
  #phone { left: 206px; top: 470px; width: 668px; height: 1490px; border-radius: 104px; background: #101014; padding: 14px; z-index: 10;
    box-shadow: 0 50px 90px rgba(14, 17, 48, .28), 0 0 0 3px #2B2B33 inset; transform-origin: 50% 40%; }
  #screen { position: relative; width: 640px; height: 1462px; border-radius: 90px; overflow: hidden; background: #F7F5F0; }
  #statusbar { position: absolute; left: 0; right: 0; top: 0; height: 78px; display: flex; align-items: center; justify-content: space-between; padding: 8px 64px 0 70px;
    font: 600 30px 'Space Grotesk', sans-serif; z-index: 3; }
  #island { position: absolute; left: 50%; top: 18px; width: 190px; height: 56px; margin-left: -95px; border-radius: 40px; background: #050507; z-index: 4; }
  #viewport { position: absolute; left: 0; top: 78px; width: 640px; height: 1385px; overflow: hidden; }
  #clipImg { position: absolute; left: 0; top: 0; width: 640px; height: 1385px; transform-origin: 0 0; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 5; pointer-events: none; }
  #live { right: 196px; top: 884px; z-index: 12; padding: 10px 18px; border-radius: 99px; background: var(--ink); color: #fff; font: 600 26px 'JetBrains Mono', monospace; opacity: 0; }
  #loupe { z-index: 13; overflow: hidden; border-radius: 34px; background: #F7F5F0; box-shadow: 0 0 0 8px #fff, 0 0 0 11px var(--ink), 0 30px 60px rgba(22, 22, 40, .35); opacity: 0; transform-origin: 50% 50%; }
  #loupeImg { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #loupeTail { inset: 0; z-index: 12; pointer-events: none; opacity: 0; filter: drop-shadow(0 0 3px rgba(22, 22, 40, .6)); }
  #live::before { content: ''; display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #FF4D6D; margin-right: 10px; vertical-align: 1px; }
  /* code editor */
  #editor { left: 60px; right: 60px; top: 300px; height: 520px; z-index: 15; border-radius: 30px; background: var(--night); color: #D9DDFF;
    box-shadow: 10px 12px 0 var(--ink); overflow: hidden; opacity: 0; }
  #editor .bar { height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 28px; background: #171A3F; color: #8E95D6; font: 500 26px 'JetBrains Mono', monospace; }
  #editor .bar i { width: 18px; height: 18px; border-radius: 50%; background: #FF5F57; }
  #editor .bar i:nth-child(2) { background: #FEBC2E; } #editor .bar i:nth-child(3) { background: #28C840; margin-right: 18px; }
  #code { padding: 34px 40px; font: 400 44px/1.55 'JetBrains Mono', monospace; white-space: pre; }
  #code .ln { display: inline-block; width: 56px; color: #4B5192; }
  #code .k { color: #FF9A85; } #code .a { color: #3DDC97; } #code .s { color: #FFC93C; }
  #code .hl { background: rgba(255, 201, 60, .16); border-radius: 8px; }
  #code .caret { display: inline-block; width: 4px; height: 50px; background: #fff; vertical-align: -10px; margin-left: 2px; }
  #code .sw { display: inline-block; width: 36px; height: 36px; border-radius: 8px; border: 3px solid #fff; vertical-align: -5px; margin-left: 16px; }
  /* host Uko + end card */
  #host { z-index: 18; width: 520px; height: 780px; left: 280px; top: 820px; }
  #end { inset: 0; z-index: 25; opacity: 0; display: flex; flex-direction: column; align-items: center; padding-top: 170px; }
  #end .logo { font: 700 250px/1 'Caveat', cursive; color: var(--ink); }
  #end .tag { font-weight: 700; font-size: 66px; letter-spacing: -0.03em; text-align: center; line-height: 1.05; margin-top: 10px; }
  #end .pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-top: 40px; max-width: 900px; }
  #end .pills span { padding: 14px 26px; border: 4px solid var(--ink); border-radius: 99px; font-weight: 700; font-size: 36px; background: #fff; }
  #end .cta { position: absolute; left: 90px; right: 90px; bottom: 150px; height: 170px; border-radius: 36px; background: var(--blue); color: #fff;
    display: flex; align-items: center; justify-content: space-between; padding: 0 56px; box-shadow: 10px 12px 0 var(--ink); border: 4px solid var(--ink); }
  #end .cta b { font-size: 60px; letter-spacing: -0.02em; } #end .cta span { font: 700 72px 'Caveat', cursive; color: var(--sun); }
  #end .url { position: absolute; bottom: 70px; left: 0; right: 0; text-align: center; font: 600 40px 'JetBrains Mono', monospace; color: var(--ink-soft); }
  .mini { position: absolute; width: 200px; height: 300px; z-index: 24; }
  #confetti { inset: 0; z-index: 19; pointer-events: none; }
  #arrow { inset: 0; z-index: 21; pointer-events: none; }
  #watermark { right: 46px; bottom: 26px; z-index: 30; font: 600 28px 'JetBrains Mono', monospace; color: rgba(22, 22, 29, .45); }
</style>
</head>
<body>
<div id="stage">
  <div id="progress" class="abs"></div>
  <div id="caps"></div>
  <svg id="arrow" class="abs" viewBox="0 0 1080 1920"><path id="arrowPath" d="" fill="none" stroke="#FF7AAE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div id="phone" class="abs">
    <div id="screen">
      <div id="island"></div>
      <div id="statusbar"><span>9:41</span><span>●●● ⌁ ▮</span></div>
      <div id="viewport"><img id="clipImg" alt=""></div>
      <div id="flash"></div>
    </div>
  </div>
  <svg id="loupeTail" class="abs" viewBox="0 0 1080 1920"><rect id="loupeRing" rx="26" fill="none" stroke="#fff" stroke-width="8"/><path id="loupeTailPath" d="" fill="#fff"/></svg>
  <div id="loupe" class="abs"><img id="loupeImg" alt=""></div>
  <div id="live" class="abs">live</div>
  <div id="editor" class="abs"><div class="bar"><i></i><i></i><i></i>App.jsx</div><div id="code"></div></div>
  <div id="host" class="abs"></div>
  <canvas id="confetti" class="abs" width="1080" height="1920"></canvas>
  <div id="end" class="abs">
    <div class="logo">Uko</div>
    <div class="tag">La mascotte vivante<br>pour ton app.</div>
    <div class="pills"><span>Web</span><span>React</span><span>Rive</span><span>9 états</span><span>17 coiffures</span></div>
    <div class="cta"><b>Obtenir Uko</b><span>6,99 €</span></div>
    <div class="url">uko-mascot.pages.dev</div>
  </div>
  <div id="watermark" class="abs">uko-mascot.pages.dev</div>
</div>
<script src="/mascot_engine/dist/uko-mascot-engine.js"></script>
<script src="ad.js"></script>
</body>
</html>
